<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ጉራጌ ሀብ | የሱቅ መቆጣጠሪያ (Gurage Hub v6.0)</title>
  
  <!-- 1. Tailwind CSS styling Framework -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 2. React 18 & ReactDOM Libraries -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 3. Babel Standalone Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- 4. Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    /* Custom Styling for Ethiopian Typography & Print Views */
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700;900&display=swap');
    body {
      font-family: 'Noto Sans Ethiopic', sans-serif;
      background-color: #000000;
      color: #ffffff;
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    // Complete Integrated Application Logic & React State Engine
    const { useState, useEffect } = React;

    // 1. Storage & Default App State Engine
    const DEFAULT_DATA = {
      baseCapitalCents: 50000000, // 500,000 ETB
      capitalGoalMonthlyCents: 100000000,
      profile: {
        shopName: "ጉራጌ ሀብ የንግድ ማዕከል",
        ownerName: "አቶ ተስፋዬ ገብሬ",
        tin: "0012345678",
        license: "BL-2026-8891",
        address: "አዲስ አበባ፣ መርካቶ",
        phone: "+251 911 223 344"
      },
      settings: {
        darkMode: true,
        appLockEnabled: true,
        pinCode: "1234"
      },
      items: [
        { id: "1", name: "ዘይት 5 ሊትር", costPriceCents: 120000, sellPriceCents: 145000, openingStock: 50 },
        { id: "2", name: "ስኳር 50 ኪ.ግ", costPriceCents: 420000, sellPriceCents: 460000, openingStock: 30 }
      ],
      sales: [
        { id: "s1", itemId: "1", itemName: "ዘይት 5 ሊትር", qty: 2, unitPriceCents: 145000, totalCents: 290000, paymentMethod: "cash", paid: true, date: "2026-07-24" }
      ],
      expenses: [
        { id: "e1", title: "የሱቅ ኪራይ", category: "ኪራይ", amountCents: 2500000, date: "2026-07-01" }
      ]
    };

    // 2. Main App Component
    function App() {
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [isNavDrawerOpen, setIsNavDrawerOpen] = useState(false);
      const [isSystemDrawerOpen, setIsSystemDrawerOpen] = useState(false);
      const [data, setData] = useState(() => {
        const saved = localStorage.getItem('gurage_hub_data');
        return saved ? JSON.parse(saved) : DEFAULT_DATA;
      });

      useEffect(() => {
        localStorage.setItem('gurage_hub_data', JSON.stringify(data));
      }, [data]);

      return (
        <div className="min-h-screen bg-black text-white flex flex-col">
          {/* Header Bar */}
          <header className="sticky top-0 z-30 bg-black border-b border-zinc-800 px-4 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <button
                onClick={() => setIsNavDrawerOpen(true)}
                className="p-2 rounded-xl bg-zinc-900 border border-zinc-800 text-white font-black"
              >
                ☰ ማውጫ
              </button>
              <h1 className="text-base font-black">
                ጉራጌ ሀብ <span className="text-xs text-zinc-400">| የሱቅ መቆጣጠሪያ</span>
              </h1>
            </div>
          </header>

          {/* Main Workspace View */}
          <main className="flex-1 p-4 max-w-4xl mx-auto w-full">
            {currentTab === 'dashboard' && (
              <div className="space-y-4">
                <div className="p-5 bg-zinc-900 rounded-3xl border border-zinc-800">
                  <span className="text-xs text-zinc-400 font-bold block mb-1">ጠቅላላ የካፒታል መጠን</span>
                  <h2 className="text-2xl font-black text-white">
                    {(data.baseCapitalCents / 100).toLocaleString('en-US')} ETB
                  </h2>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <button 
                    onClick={() => setCurrentTab('sales')}
                    className="p-4 bg-zinc-900 hover:bg-zinc-800 rounded-2xl border border-zinc-800 text-left font-black text-sm"
                  >
                    🛒 አዲስ ሽያጭ መዝግብ
                  </button>
                  <button 
                    onClick={() => setCurrentTab('report_9page')}
                    className="p-4 bg-zinc-900 hover:bg-zinc-800 rounded-2xl border border-zinc-800 text-left font-black text-sm"
                  >
                    📄 ባለ 9-ገጽ ሪፖርት
                  </button>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    // Render App to DOM Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
